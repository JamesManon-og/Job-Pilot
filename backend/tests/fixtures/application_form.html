<!DOCTYPE html>
<html>
<head><title>Test Application Form</title></head>
<body>
<h1>Apply for Frontend Engineer</h1>
<form id="application">
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name">

  <label for="email">Email Address</label>
  <input type="email" id="email" name="email">

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" name="phone">

  <label for="linkedin">LinkedIn Profile</label>
  <input type="url" id="linkedin" name="linkedin">

  <label for="github">GitHub URL</label>
  <input type="url" id="github" name="github">

  <label for="portfolio">Portfolio Website</label>
  <input type="url" id="portfolio" name="portfolio">

  <label for="salary">Salary Expectations</label>
  <input type="text" id="salary" name="salary_expectation">

  <label for="start">Available Start Date</label>
  <input type="text" id="start" name="start_date" placeholder="When can you start?">

  <label for="authorization">Work Authorization</label>
  <input type="text" id="authorization" name="work_authorization">

  <label for="experience">Years of Experience</label>
  <input type="number" id="experience" name="years_experience">

  <label for="resume">Resume (PDF)</label>
  <input type="file" id="resume" name="resume" accept=".pdf">

  <label for="cover_letter">Cover Letter</label>
  <textarea id="cover_letter" name="cover_letter" rows="6"></textarea>

  <label for="q1">Why do you want to work here?</label>
  <textarea id="q1" name="q1" rows="4"></textarea>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
