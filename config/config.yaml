# JobPilot user preferences. Every key is optional; defaults shown.

min_match_score: 75            # only jobs scoring >= this are considered for application
preferred_technologies: []     # e.g. [react, nextjs, typescript, tailwind, nodejs, postgresql]
preferred_countries: []        # e.g. [Philippines, United States]; empty = anywhere
preferred_salary_min: null     # annual USD; null = no minimum
preferred_job_titles: []       # e.g. [frontend developer, full stack developer]
remote_only: true
blacklist_companies: []        # never scrape/apply to these
max_applications_per_day: 10   # hard cap, enforced regardless of mode
auto_submit_enabled: false     # when true AND human_approval_enabled is false, submits without review
human_approval_enabled: true   # queue applications for manual review before submission (default)
resume_version: default
cover_letter_template: default

# Your personal info for autofilling applications (Milestone 9+).
applicant:
  name: ""
  email: ""
  phone: ""
  address: ""
  portfolio_url: ""
  github_url: ""
  linkedin_url: ""
  work_authorization: ""       # e.g. "US Citizen", "Authorized to work"
  salary_expectation: ""       # e.g. "$120,000"
  available_start_date: ""     # e.g. "Immediately", "2 weeks"
  resume_file: ""              # path to resume PDF for upload, e.g. data/resumes/v1.pdf
