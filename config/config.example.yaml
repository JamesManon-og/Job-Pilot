# JobPilot user preferences — copy to config/config.yaml and edit.
# config.yaml is gitignored because it holds your personal details.
# Every key is optional; defaults shown.

min_match_score: 75            # `jobpilot run` only prepares jobs whose LLM score is >= this
preferred_technologies: []     # e.g. [react, nextjs, typescript, tailwind, nodejs, postgresql]
preferred_countries: []        # e.g. [Philippines, United States]; empty = anywhere
preferred_salary_min: null     # annual USD; null = no minimum
preferred_job_titles: []       # used as search terms when `search.queries` is empty
remote_only: true              # skips onsite jobs; also filters searches to remote where supported
blacklist_companies: []        # never searched, prepared, or applied to
excluded_keywords: []          # skip postings whose title/description contains any of these
employment_types: []           # e.g. [full_time, contract]; empty = any
max_applications_per_day: 10   # hard cap on submissions (and forms open for submission) per local day
resume_version: default
cover_letter_template: default

# What to search for on every enabled platform.
search:
  queries: []                  # e.g. ["react developer", "full stack developer"]
  location: ""                 # e.g. "Philippines"; empty = the platform's default
  max_results_per_query: 25
  posted_within_days: 14

# Job boards. Log in once with `jobpilot login <platform>`, then enable it here.
# RemoteOK needs no account. JobStreet and OnlineJobs.ph can search without one
# but need your login to apply; LinkedIn needs it for both.
platforms:
  remoteok:
    enabled: true
    min_delay_seconds: 2.0
  jobstreet:
    enabled: false
    min_delay_seconds: 3.0
    # options: {domain: "www.jobstreet.com.sg"}   # default: ph.jobstreet.com
  onlinejobs:
    enabled: false
    min_delay_seconds: 3.0
  linkedin:
    enabled: false             # LinkedIn's terms restrict automation — your call
    min_delay_seconds: 5.0
    max_results_per_query: 25
    max_applications_per_day: 5

# Human approval is mandatory and only you click submit. The old
# auto_submit_enabled / human_approval_enabled switches are ignored.

# Your details for autofilling applications. Blank fields are left for you.
applicant:
  name: ""                     # required before `jobpilot apply`
  email: ""                    # required before `jobpilot apply`
  phone: ""
  address: ""
  city: ""
  country: ""
  portfolio_url: ""
  github_url: ""
  linkedin_url: ""
  work_authorization: ""       # answer to "Are you authorized to work…?", e.g. "Yes"
  requires_sponsorship: ""     # answer to "Will you require sponsorship?", e.g. "No"
  salary_expectation: ""       # e.g. "$60,000"
  available_start_date: ""     # e.g. "Immediately", "2 weeks"
  years_experience: ""         # used only for the generic "years of experience" question
  resume_file: ""              # PDF to upload; blank = the active imported resume
